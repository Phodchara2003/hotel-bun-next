<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้าง QR Code ทดสอบ</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body style="padding: 20px; font-family: Arial, sans-serif;">
    <h2>สร้าง QR Code สำหรับทดสอบระบบชำระเงิน</h2>
    
    <div style="margin: 20px 0;">
        <label for="qrText">ข้อความใน QR Code:</label><br>
        <input type="text" id="qrText" value="promptpay://1234567890123?amount=1500" style="width: 400px; padding: 5px; margin: 10px 0;">
        <br>
        <button onclick="generateQR()" style="padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer;">สร้าง QR Code</button>
    </div>
    
    <div id="qrcode" style="margin: 20px 0;"></div>
    
    <div id="downloadSection" style="display: none; margin: 20px 0;">
        <h3>ดาวน์โหลด QR Code:</h3>
        <button onclick="downloadQR()" style="padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer;">ดาวน์โหลดไฟล์ PNG</button>
        <p style="color: #666; font-size: 14px;">
            หลังจากดาวน์โหลดแล้ว ให้ไปที่หน้า <a href="http://localhost:3000/admin/payment-settings" target="_blank">Admin Payment Settings</a> 
            เพื่ออัปโหลด QR Code นี้
        </p>
    </div>

    <script>
        let qrCanvas = null;
        
        function generateQR() {
            const qrText = document.getElementById('qrText').value;
            const qrContainer = document.getElementById('qrcode');
            
            // Clear previous QR code
            qrContainer.innerHTML = '';
            
            // Generate QR code
            QRCode.toCanvas(qrText, { width: 300, margin: 2 }, function (error, canvas) {
                if (error) {
                    console.error(error);
                    qrContainer.innerHTML = '<p style="color: red;">เกิดข้อผิดพลาดในการสร้าง QR Code</p>';
                    return;
                }
                
                qrCanvas = canvas;
                qrContainer.appendChild(canvas);
                document.getElementById('downloadSection').style.display = 'block';
            });
        }
        
        function downloadQR() {
            if (!qrCanvas) return;
            
            // Create download link
            const link = document.createElement('a');
            link.download = 'hotel-payment-qr.png';
            link.href = qrCanvas.toDataURL();
            link.click();
        }
        
        // Generate QR on page load
        generateQR();
    </script>
</body>
</html>
