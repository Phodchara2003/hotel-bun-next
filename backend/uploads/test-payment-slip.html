<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Payment Slip</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .slip { width: 300px; background: white; border: 2px solid #ddd; padding: 20px; margin: 20px auto; }
        .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 15px; }
        .amount { font-size: 24px; font-weight: bold; color: #2c5aa0; text-align: center; margin: 20px 0; }
        .detail { margin: 8px 0; }
        .qr { width: 100px; height: 100px; background: #f0f0f0; border: 1px solid #ccc; margin: 15px auto; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <div class="slip">
        <div class="header">
            <h2>สลีปการชำระเงิน</h2>
            <p>Payment Receipt</p>
        </div>
        <div class="amount">฿7,600.00</div>
        <div class="detail"><strong>วันที่:</strong> 20 ก.ย. 2568</div>
        <div class="detail"><strong>เวลา:</strong> 14:30:25</div>
        <div class="detail"><strong>อ้างอิง:</strong> HTL123756</div>
        <div class="detail"><strong>ผู้โอน:</strong> Phodchara M.</div>
        <div class="qr">QR Code</div>
        <div style="text-align: center; margin-top: 15px; font-size: 12px; color: #666;">
            การจองห้องพักโรงแรม<br>
            ชำระเงินสำเร็จแล้ว
        </div>
    </div>
</body>
</html>
