<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทดสอบ API ค้นหาห้องว่างด้วยประเภทเตียง</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, button { padding: 10px; width: 100%; font-size: 16px; }
        button { background: #059669; color: white; border: none; cursor: pointer; margin-top: 10px; }
        button:hover { background: #047857; }
        .results { margin-top: 20px; padding: 20px; background: #f9f9f9; }
        .room-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; background: white; border-radius: 8px; }
        .loading { color: #666; }
        .error { color: red; }
        .success { color: green; }
        .bed-type { background: #e0f2fe; color: #0277bd; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .available-count { background: #e8f5e8; color: #2e7d32; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .test-section { margin: 20px 0; padding: 20px; background: #f0f8ff; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>ทดสอบ API ค้นหาห้องว่างด้วยประเภทเตียง</h1>
        
        <div class="test-section">
            <h3>🔍 ค้นหาห้องพัก</h3>
            <form id="searchForm">
                <div class="form-group">
                    <label for="checkin">วันที่เข้าพัก:</label>
                    <input type="date" id="checkin" required>
                </div>
                
                <div class="form-group">
                    <label for="checkout">วันที่ออก:</label>
                    <input type="date" id="checkout" required>
                </div>
                
                <div class="form-group">
                    <label for="guests">จำนวนผู้เข้าพัก:</label>
                    <select id="guests">
                        <option value="1">1 คน</option>
                        <option value="2" selected>2 คน</option>
                        <option value="3">3 คน</option>
                        <option value="4">4 คน</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="bedType">ประเภทเตียง:</label>
                    <select id="bedType">
                        <option value="">ทุกประเภท</option>
                        <option value="single">เตียงเดี่ยว</option>
                        <option value="double">เตียงคู่</option>
                        <option value="twin">เตียงแฝด</option>
                        <option value="king">เตียงคิงไซส์</option>
                        <option value="queen">เตียงควีนไซส์</option>
                    </select>
                </div>
                
                <button type="submit">ค้นหาห้องว่าง</button>
            </form>
        </div>
        
        <div class="test-section">
            <h3>🏨 ทดสอบตรวจสอบห้องว่างเฉพาะประเภท</h3>
            <div class="form-group">
                <label for="roomTypeId">Room Type ID:</label>
                <input type="number" id="roomTypeId" placeholder="เช่น 8, 10" value="8">
            </div>
            <button onclick="checkSpecificRoom()">ตรวจสอบห้องประเภทนี้</button>
        </div>
        
        <div id="results" class="results" style="display: none;"></div>
    </div>

    <script>
        // ตั้งค่าวันที่เริ่มต้น
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);
        const dayAfter = new Date(today);
        dayAfter.setDate(dayAfter.getDate() + 2);
        
        document.getElementById('checkin').value = tomorrow.toISOString().split('T')[0];
        document.getElementById('checkout').value = dayAfter.toISOString().split('T')[0];

        // ฟังก์ชันแปลงประเภทเตียงเป็นภาษาไทย
        function getBedTypeText(bedType) {
            const bedTypes = {
                'single': 'เตียงเดี่ยว',
                'double': 'เตียงคู่', 
                'twin': 'เตียงแฝด',
                'king': 'เตียงคิงไซส์',
                'queen': 'เตียงควีนไซส์'
            };
            return bedTypes[bedType] || bedType;
        }

        // ฟังก์ชันค้นหาห้องพัก
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await searchRooms();
        });

        async function searchRooms() {
            const checkin = document.getElementById('checkin').value;
            const checkout = document.getElementById('checkout').value;
            const guests = document.getElementById('guests').value;
            const bedType = document.getElementById('bedType').value;
            const resultsDiv = document.getElementById('results');
            
            if (!checkin || !checkout) {
                alert('กรุณาเลือกวันที่เข้าพักและออก');
                return;
            }
            
            if (new Date(checkin) >= new Date(checkout)) {
                alert('วันที่ออกต้องหลังจากวันที่เข้าพัก');
                return;
            }
            
            resultsDiv.style.display = 'block';
            resultsDiv.innerHTML = '<div class="loading">🔍 กำลังค้นหา...</div>';
            
            try {
                let url = `http://localhost:3001/api/rooms/search?checkin=${checkin}&checkout=${checkout}&guests=${guests}`;
                if (bedType) {
                    url += `&bedType=${bedType}`;
                }
                
                console.log('🔍 Calling API:', url);
                
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('📊 API Response:', data);
                
                if (data.success && data.data && data.data.length > 0) {
                    let html = `
                        <div class="success">
                            <h3>✅ พบห้องพักว่าง ${data.data.length} ประเภท</h3>
                            <p>📅 สำหรับวันที่ ${new Date(checkin).toLocaleDateString('th-TH')} - ${new Date(checkout).toLocaleDateString('th-TH')}</p>
                            ${bedType ? `<p>🛏️ ประเภทเตียง: ${getBedTypeText(bedType)}</p>` : ''}
                        </div>
                    `;
                    
                    data.data.forEach(room => {
                        html += `
                            <div class="room-card">
                                <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 10px;">
                                    <div>
                                        <h4 style="margin: 0 0 5px 0;">${room.room_type_name}</h4>
                                        <span class="bed-type">${getBedTypeText(room.bed_type)}</span>
                                        <span class="available-count">${room.available_count} ห้องว่าง</span>
                                    </div>
                                    <div style="text-align: right;">
                                        <div style="font-size: 20px; font-weight: bold; color: #059669;">
                                            ฿${parseFloat(room.price_per_night).toLocaleString()}
                                        </div>
                                        <div style="font-size: 12px; color: #666;">ต่อคืน</div>
                                    </div>
                                </div>
                                
                                <p style="margin: 10px 0; color: #666;">${room.description}</p>
                                
                                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0;">
                                    <div><strong>จำนวนผู้เข้าพัก:</strong> สูงสุด ${room.max_guests} คน</div>
                                    <div><strong>ขนาดห้อง:</strong> ${room.size_sqm} ตร.ม.</div>
                                </div>
                                
                                ${room.room_numbers && room.room_numbers.length > 0 ? 
                                    `<div><strong>ห้องที่ว่าง:</strong> ${room.room_numbers.slice(0, 8).join(', ')}${room.room_numbers.length > 8 ? ` และอีก ${room.room_numbers.length - 8} ห้อง` : ''}</div>` 
                                    : ''}
                                
                                <div style="margin-top: 15px;">
                                    <button onclick="checkAndBook(${room.room_type_id}, '${room.room_type_name}', '${room.bed_type}')" 
                                            style="background: #d97706; width: auto; padding: 8px 16px; margin-right: 10px;">
                                        🏨 ตรวจสอบและจอง
                                    </button>
                                    <button onclick="checkRoomAvailability(${room.room_type_id})" 
                                            style="background: #0ea5e9; width: auto; padding: 8px 16px;">
                                        🔍 ตรวจสอบห้องว่าง
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                    
                    resultsDiv.innerHTML = html;
                } else {
                    resultsDiv.innerHTML = `
                        <div class="error">
                            <h3>❌ ไม่พบห้องพักว่าง</h3>
                            <p>ขออภัย ไม่มีห้องพักว่างในช่วงวันที่ที่คุณเลือก${bedType ? ' สำหรับประเภทเตียงที่เลือก' : ''}</p>
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('❌ Error:', error);
                resultsDiv.innerHTML = `
                    <div class="error">
                        <h3>⚠️ เกิดข้อผิดพลาด</h3>
                        <p>ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้: ${error.message}</p>
                    </div>
                `;
            }
        }

        // ฟังก์ชันตรวจสอบห้องว่างเฉพาะประเภท
        async function checkRoomAvailability(roomTypeId) {
            const checkin = document.getElementById('checkin').value;
            const checkout = document.getElementById('checkout').value;
            
            if (!checkin || !checkout) {
                alert('กรุณาเลือกวันที่เข้าพักและออกก่อน');
                return;
            }
            
            try {
                const url = `http://localhost:3001/api/rooms/availability?room_type_id=${roomTypeId}&check_in=${checkin}&check_out=${checkout}`;
                console.log('🔍 Checking availability:', url);
                
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('📊 Availability Response:', data);
                
                if (data.success) {
                    const availability = data.data;
                    alert(`ห้องประเภท ${roomTypeId}: ${availability.available ? `✅ ว่าง ${availability.available_count} ห้อง` : '❌ ไม่ว่าง'}`);
                } else {
                    alert('❌ ไม่สามารถตรวจสอบได้: ' + data.message);
                }
            } catch (error) {
                console.error('❌ Error:', error);
                alert('เกิดข้อผิดพลาด: ' + error.message);
            }
        }

        // ฟังก์ชันจำลองการตรวจสอบและจอง
        async function checkAndBook(roomTypeId, roomTypeName, bedType) {
            const checkin = document.getElementById('checkin').value;
            const checkout = document.getElementById('checkout').value;
            const guests = document.getElementById('guests').value;
            
            if (!checkin || !checkout) {
                alert('กรุณาเลือกวันที่เข้าพักและออกก่อน');
                return;
            }
            
            try {
                // ตรวจสอบห้องว่างอีกครั้ง
                const url = `http://localhost:3001/api/rooms/availability?room_type_id=${roomTypeId}&check_in=${checkin}&check_out=${checkout}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success && data.data.available && data.data.available_count > 0) {
                    const bookingUrl = `/booking/new?roomType=${roomTypeId}&checkin=${checkin}&checkout=${checkout}&guests=${guests}&bedType=${bedType}&roomTypeName=${encodeURIComponent(roomTypeName)}`;
                    alert(`✅ ห้อง "${roomTypeName}" ยังว่างอยู่!\n\n🔗 จะไปหน้าจอง: ${bookingUrl}`);
                    console.log('Booking URL:', bookingUrl);
                } else {
                    alert(`❌ ขออภัย ห้อง "${roomTypeName}" ไม่ว่างแล้วในช่วงวันที่ที่เลือก`);
                    // รีเฟรชการค้นหา
                    await searchRooms();
                }
            } catch (error) {
                console.error('❌ Error:', error);
                alert('เกิดข้อผิดพลาดในการตรวจสอบห้องว่าง');
            }
        }

        // ฟังก์ชันทดสอบตรวจสอบห้องเฉพาะ
        async function checkSpecificRoom() {
            const roomTypeId = document.getElementById('roomTypeId').value;
            if (!roomTypeId) {
                alert('กรุณาใส่ Room Type ID');
                return;
            }
            await checkRoomAvailability(roomTypeId);
        }
    </script>
</body>
</html>
