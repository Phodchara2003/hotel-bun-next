<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทดสอบการแสดงวันที่</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .result { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 3px; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
    </style>
</head>
<body>
    <h1>ทดสอบการแสดงวันที่ในระบบจองโรงแรม</h1>
    
    <div class="test-section">
        <h2>1. ทดสอบข้อมูลจาก API Bookings</h2>
        <div id="api-test"></div>
    </div>
    
    <div class="test-section">
        <h2>2. ทดสอบการแปลงวันที่ต่างๆ</h2>
        <div id="date-test"></div>
    </div>
    
    <div class="test-section">
        <h2>3. ทดสอบแสดงผลในรูปแบบการจอง</h2>
        <div id="booking-display"></div>
    </div>

    <script>
        // ฟังก์ชันสำหรับแปลงวันที่ (คัดลอกจาก dateUtils.js)
        function createDateFromString(dateString) {
            if (!dateString) return null;
            
            // ถ้าเป็น ISO string (มี T) ให้ใช้ Date constructor โดยตรง
            if (typeof dateString === 'string' && dateString.includes('T')) {
                const date = new Date(dateString);
                return isNaN(date.getTime()) ? null : date;
            }
            
            // ถ้าเป็น YYYY-MM-DD format
            if (typeof dateString === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateString)) {
                const [year, month, day] = dateString.split('-').map(Number);
                return new Date(year, month - 1, day);
            }
            
            // ลองใช้ Date constructor โดยตรง
            const date = new Date(dateString);
            return isNaN(date.getTime()) ? null : date;
        }

        function formatDateThai(dateString) {
            if (!dateString) return 'ไม่ระบุวันที่';
            
            try {
                const date = createDateFromString(dateString);
                if (!date) return 'วันที่ไม่ถูกต้อง';
                
                return date.toLocaleDateString('th-TH', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
            } catch (error) {
                console.error('Error formatting date:', error);
                return 'วันที่ไม่ถูกต้อง';
            }
        }

        // ทดสอบข้อมูลจาก API
        async function testApiData() {
            const apiTestDiv = document.getElementById('api-test');
            
            try {
                const response = await fetch('http://localhost:3001/api/bookings', {
                    headers: { 'Authorization': 'Bearer test-token' }
                });
                const data = await response.json();
                
                if (data.success && data.data && data.data.length > 0) {
                    const booking = data.data[0];
                    apiTestDiv.innerHTML = `
                        <div class="result success">
                            <h3>ข้อมูลการจองจาก API:</h3>
                            <p><strong>ID:</strong> ${booking.id}</p>
                            <p><strong>วันที่เข้าพักดิบ:</strong> ${booking.check_in_date}</p>
                            <p><strong>วันที่ออกดิบ:</strong> ${booking.check_out_date}</p>
                            <p><strong>วันที่เข้าพักแปลงแล้ว:</strong> ${formatDateThai(booking.check_in_date)}</p>
                            <p><strong>วันที่ออกแปลงแล้ว:</strong> ${formatDateThai(booking.check_out_date)}</p>
                        </div>
                    `;
                } else {
                    apiTestDiv.innerHTML = '<div class="result error">ไม่พบข้อมูลการจอง</div>';
                }
            } catch (error) {
                apiTestDiv.innerHTML = `<div class="result error">Error: ${error.message}</div>`;
            }
        }

        // ทดสอบการแปลงวันที่
        function testDateFormatting() {
            const dateTestDiv = document.getElementById('date-test');
            const testDates = [
                "2025-10-04T17:00:00.000Z",
                "2025-10-05T17:00:00.000Z", 
                "2025-10-04",
                null,
                undefined,
                "",
                "invalid-date"
            ];
            
            let html = '';
            testDates.forEach((date, index) => {
                const result = formatDateThai(date);
                html += `
                    <div class="result">
                        <strong>Input ${index + 1}:</strong> ${date} 
                        <br><strong>Output:</strong> ${result}
                    </div>
                `;
            });
            
            dateTestDiv.innerHTML = html;
        }

        // ทดสอบแสดงผลในรูปแบบการจอง
        function testBookingDisplay() {
            const bookingDiv = document.getElementById('booking-display');
            
            // จำลองข้อมูลการจองที่มีทั้ง format แบบ API และ guest data
            const mockBookings = [
                {
                    id: 1,
                    hotel_name: "โรงแรมวรุณภัฏ มหาวิทยาลัยราชภัฏมหาสารคาม",
                    check_in_date: "2025-10-04T17:00:00.000Z",
                    check_out_date: "2025-10-05T17:00:00.000Z",
                    guests: 1,
                    status: "pending",
                    room_type_name: "ห้องเตียงคู่ (Double Room)"
                }
            ];
            
            let html = '<h3>ตัวอย่างการแสดงผลการจอง:</h3>';
            
            mockBookings.forEach(booking => {
                html += `
                    <div style="border: 1px solid #ccc; padding: 15px; margin: 10px 0; border-radius: 8px;">
                        <h4>${booking.hotel_name}</h4>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0;">
                            <div>
                                <small>วันที่เข้าพัก</small><br>
                                <strong>${formatDateThai(booking.check_in_date)}</strong>
                            </div>
                            <div>
                                <small>วันที่ออก</small><br>
                                <strong>${formatDateThai(booking.check_out_date)}</strong>
                            </div>
                        </div>
                        <p><strong>ห้องพัก:</strong> ${booking.room_type_name}</p>
                        <p><strong>จำนวนผู้เข้าพัก:</strong> ${booking.guests} คน</p>
                        <span style="background: #fef7cd; color: #92400e; padding: 4px 12px; border-radius: 12px; font-size: 14px;">
                            รอการยืนยัน
                        </span>
                    </div>
                `;
            });
            
            bookingDiv.innerHTML = html;
        }

        // เรียกใช้ทดสอบทั้งหมด
        document.addEventListener('DOMContentLoaded', function() {
            testApiData();
            testDateFormatting();
            testBookingDisplay();
        });
    </script>
</body>
</html>
