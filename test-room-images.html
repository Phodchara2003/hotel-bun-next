<!DOCTYPE html>
<html>
<head>
    <title>Image Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .image-test { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        img { max-width: 300px; height: 200px; object-fit: cover; margin: 10px; border: 2px solid #ddd; }
        .working { border-color: green; }
        .failed { border-color: red; }
    </style>
</head>
<body>
    <h1>🖼️ Room Images Test</h1>
    
    <div class="image-test">
        <h3>📊 API Data Test</h3>
        <div id="api-data">Loading...</div>
    </div>
    
    <div class="image-test">
        <h3>🖼️ Direct Image URLs Test</h3>
        <div id="image-container"></div>
    </div>

    <script>
        // Test API data
        fetch('http://localhost:3001/api/room-types-with-images')
            .then(response => response.json())
            .then(data => {
                document.getElementById('api-data').innerHTML = 
                    '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
                
                // Test images from API data
                const container = document.getElementById('image-container');
                
                data.data.forEach((room, roomIndex) => {
                    const roomDiv = document.createElement('div');
                    roomDiv.innerHTML = `<h4>Room ${room.id}: ${room.name}</h4>`;
                    
                    if (Array.isArray(room.images)) {
                        room.images.forEach((imagePath, imageIndex) => {
                            const img = document.createElement('img');
                            const fullUrl = `http://localhost:3001${imagePath}`;
                            
                            img.src = fullUrl;
                            img.alt = `${room.name} - Image ${imageIndex + 1}`;
                            img.title = fullUrl;
                            
                            img.onload = function() {
                                this.className = 'working';
                                console.log('✅ Image loaded:', fullUrl);
                            };
                            
                            img.onerror = function() {
                                this.className = 'failed';
                                console.log('❌ Image failed:', fullUrl);
                            };
                            
                            roomDiv.appendChild(img);
                        });
                    } else {
                        roomDiv.innerHTML += '<p>No images available</p>';
                    }
                    
                    container.appendChild(roomDiv);
                });
            })
            .catch(error => {
                document.getElementById('api-data').innerHTML = 
                    '<span style="color: red;">Error: ' + error.message + '</span>';
            });
    </script>
</body>
</html>
