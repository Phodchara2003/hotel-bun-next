<!DOCTYPE html>
<html>
<head>
    <title>Test Image Upload</title>
</head>
<body>
    <h1>Test Room Image Upload</h1>
    <form id="uploadForm">
        <input type="file" id="fileInput" multiple accept="image/*">
        <button type="button" onclick="uploadImages()">Upload</button>
    </form>
    
    <div id="result"></div>

    <script>
        async function uploadImages() {
            const fileInput = document.getElementById('fileInput');
            const files = fileInput.files;
            
            if (files.length === 0) {
                alert('Please select files');
                return;
            }
            
            console.log('Selected files:', Array.from(files).map(f => ({ name: f.name, size: f.size })));
            
            const formData = new FormData();
            for (let file of files) {
                formData.append('roomImages', file);
            }
            
            try {
                console.log('Sending upload request...');
                const response = await fetch('http://localhost:3001/api/admin/rooms/1/upload-images', {
                    method: 'POST',
                    body: formData
                });
                
                console.log('Response status:', response.status);
                const result = await response.json();
                console.log('Response data:', result);
                
                document.getElementById('result').innerHTML = JSON.stringify(result, null, 2);
            } catch (error) {
                console.error('Upload error:', error);
                document.getElementById('result').innerHTML = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
