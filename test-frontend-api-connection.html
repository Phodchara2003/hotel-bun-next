<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทดสอบ API การค้นหาห้องพัก</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center mb-8">ทดสอบ API การค้นหาห้องพัก</h1>
        
        <!-- ฟอร์มทดสอบ -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
            <h2 class="text-xl font-bold mb-4">ค้นหาห้องว่าง</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium mb-2">วันเข้าพัก</label>
                    <input type="date" id="checkin" class="w-full px-3 py-2 border border-gray-300 rounded-md" value="2025-01-15">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">วันออก</label>
                    <input type="date" id="checkout" class="w-full px-3 py-2 border border-gray-300 rounded-md" value="2025-01-16">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">ผู้เข้าพัก</label>
                    <select id="guests" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                        <option value="1">1 คน</option>
                        <option value="2">2 คน</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">ประเภทเตียง</label>
                    <select id="bedType" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                        <option value="">ทุกประเภท</option>
                        <option value="single">เตียงเดี่ยว</option>
                        <option value="double">เตียงคู่</option>
                    </select>
                </div>
            </div>
            <button onclick="searchRooms()" class="w-full bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md font-medium">
                🔍 ค้นหาห้องว่าง
            </button>
        </div>

        <!-- แสดงผลลัพธ์ -->
        <div id="results" class="space-y-4"></div>
        
        <!-- แสดง Log -->
        <div class="bg-gray-800 text-green-400 rounded-lg p-4 mt-8" style="font-family: monospace;">
            <h3 class="text-white font-bold mb-2">API Response Log:</h3>
            <div id="log" class="text-sm"></div>
        </div>
    </div>

    <script>
        let logElement = document.getElementById('log');
        let resultsElement = document.getElementById('results');

        function addLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            logElement.innerHTML += `[${timestamp}] ${message}<br>`;
            logElement.scrollTop = logElement.scrollHeight;
        }

        async function searchRooms() {
            const checkin = document.getElementById('checkin').value;
            const checkout = document.getElementById('checkout').value;
            const guests = document.getElementById('guests').value;
            const bedType = document.getElementById('bedType').value;

            // เคลียร์ผลลัพธ์เดิม
            resultsElement.innerHTML = '<div class="text-center text-gray-500">กำลังค้นหา...</div>';
            
            // สร้าง URL พารามิเตอร์
            const params = new URLSearchParams({
                checkin,
                checkout,
                guests
            });
            
            if (bedType) {
                params.set('bedType', bedType);
            }

            const apiUrl = `http://localhost:3001/api/rooms/search?${params.toString()}`;
            
            addLog(`🔍 เรียก API: ${apiUrl}`);
            addLog(`📋 พารามิเตอร์: checkin=${checkin}, checkout=${checkout}, guests=${guests}, bedType=${bedType || 'ทุกประเภท'}`);

            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                
                addLog(`📥 ได้รับผลลัพธ์: ${JSON.stringify(data, null, 2)}`);

                if (data.success) {
                    displayResults(data);
                    addLog(`✅ สำเร็จ: พบ ${data.count} ประเภทห้อง`);
                } else {
                    resultsElement.innerHTML = `<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">❌ ${data.message}</div>`;
                    addLog(`❌ ล้มเหลว: ${data.message}`);
                }
            } catch (error) {
                resultsElement.innerHTML = `<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">❌ เกิดข้อผิดพลาด: ${error.message}</div>`;
                addLog(`❌ เกิดข้อผิดพลาด: ${error.message}`);
            }
        }

        function displayResults(data) {
            if (!data.data || data.data.length === 0) {
                resultsElement.innerHTML = '<div class="bg-yellow-100 border border-yellow-400 text-yellow-700 px-4 py-3 rounded">ไม่พบห้องว่างตามเงื่อนไขที่ระบุ</div>';
                return;
            }

            let html = `<div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">✅ พบ ${data.count} ประเภทห้องที่ว่าง</div>`;
            
            data.data.forEach((room, index) => {
                html += `
                    <div class="bg-white rounded-lg shadow-md p-6 border-l-4 border-blue-500">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="text-xl font-bold text-gray-800">${room.room_type_name}</h3>
                                <p class="text-gray-600 mt-1">🛏️ ${room.bed_type === 'single' ? 'เตียงเดี่ยว' : 'เตียงคู่'}</p>
                                <p class="text-gray-600">👥 รองรับ ${room.max_guests} คน</p>
                                <p class="text-gray-600">📏 ขนาด ${room.size_sqm || 'ไม่ระบุ'} ตร.ม.</p>
                            </div>
                            <div class="text-right">
                                <div class="text-2xl font-bold text-blue-600">฿${parseFloat(room.price_per_night).toLocaleString()}</div>
                                <div class="text-sm text-gray-500">ต่อคืน</div>
                                <div class="text-green-600 font-medium mt-2">🏨 ${room.available_count} ห้องว่าง</div>
                            </div>
                        </div>
                        
                        ${room.description ? `<p class="text-gray-700 mt-4">${room.description}</p>` : ''}
                        
                        <div class="mt-4 pt-4 border-t border-gray-200">
                            <div class="text-sm text-gray-500">
                                <strong>ห้องที่ว่าง:</strong> ${room.room_numbers || 'ไม่ระบุ'}<br>
                                <strong>ชั้น:</strong> ${room.floors || 'ไม่ระบุ'}
                            </div>
                        </div>
                        
                        <button class="mt-4 bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-md font-medium transition-colors">
                            📋 จองห้องนี้
                        </button>
                    </div>
                `;
            });
            
            resultsElement.innerHTML = html;
        }

        // ค้นหาทันทีเมื่อโหลดหน้า
        window.onload = () => {
            addLog('🚀 เริ่มต้นระบบทดสอบ API');
            searchRooms();
        };
    </script>
</body>
</html>
