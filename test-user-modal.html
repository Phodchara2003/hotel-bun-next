<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทดสอบ User Modal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .test-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            border-left: 5px solid #007bff;
        }
        
        .button {
            background: linear-gradient(45deg, #007bff, #0056b3);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 10px 10px 0;
            transition: all 0.3s ease;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,123,255,0.3);
        }
        
        .result {
            background: #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            position: relative;
        }
        
        .close {
            position: absolute;
            right: 15px;
            top: 10px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 ทดสอบ User Modal - แก้ไขข้อมูลผู้ใช้</h1>
        
        <div class="test-section">
            <h2>📋 1. ข้อมูลผู้ใช้ตัวอย่าง</h2>
            <p>ข้อมูลผู้ใช้ที่จะใช้ทดสอบ Modal</p>
            <button class="button" onclick="showSampleUsers()">📄 แสดงข้อมูลผู้ใช้</button>
            <div id="usersData" class="result" style="display: none;"></div>
        </div>
        
        <div class="test-section">
            <h2>✏️ 2. ทดสอบเปิด Modal แก้ไข</h2>
            <p>ทดสอบการเปิด Modal พร้อมข้อมูลผู้ใช้</p>
            <button class="button" onclick="openEditModal('admin')">👤 แก้ไข Admin User</button>
            <button class="button" onclick="openEditModal('staff')">👨‍💼 แก้ไข Staff User</button>
            <button class="button" onclick="openEditModal('user')">👥 แก้ไข Regular User</button>
        </div>
        
        <div class="test-section">
            <h2>🔗 3. ทดสอบใน Admin Panel จริง</h2>
            <p>เปิดหน้า Admin Panel เพื่อทดสอบการทำงานจริง</p>
            <a href="http://localhost:3002/admin/users" target="_blank" class="button">🌐 เปิด Admin Users</a>
        </div>
    </div>

    <!-- Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2>✏️ แก้ไขข้อมูลผู้ใช้</h2>
            
            <form id="editForm">
                <div class="form-group">
                    <label>ชื่อผู้ใช้:</label>
                    <input type="text" id="username" name="username">
                </div>
                
                <div class="form-group">
                    <label>อีเมล:</label>
                    <input type="email" id="email" name="email">
                </div>
                
                <div class="form-group">
                    <label>ชื่อจริง:</label>
                    <input type="text" id="first_name" name="first_name">
                </div>
                
                <div class="form-group">
                    <label>นามสกุล:</label>
                    <input type="text" id="last_name" name="last_name">
                </div>
                
                <div class="form-group">
                    <label>เบอร์โทร:</label>
                    <input type="tel" id="phone" name="phone">
                </div>
                
                <div class="form-group">
                    <label>บทบาท:</label>
                    <select id="role" name="role">
                        <option value="user">ผู้ใช้ทั่วไป</option>
                        <option value="staff">พนักงาน</option>
                        <option value="admin">ผู้ดูแลระบบ</option>
                    </select>
                </div>
                
                <div style="text-align: center; margin-top: 20px;">
                    <button type="button" onclick="saveUser()" class="button">💾 บันทึก</button>
                    <button type="button" onclick="closeModal()" class="button" style="background: #6c757d;">❌ ยกเลิก</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ข้อมูลผู้ใช้ตัวอย่าง
        const sampleUsers = {
            admin: {
                id: 7,
                email: 'admin@hotel.com',
                first_name: 'Admin',
                last_name: 'User',
                phone: '0999999999',
                role: 'admin',
                username: 'admin'
            },
            staff: {
                id: 2,
                email: 'staff@hotel.com',
                first_name: 'Staff',
                last_name: 'Member',
                phone: '0800000001',
                role: 'staff',
                username: 'staff'
            },
            user: {
                id: 21,
                email: 'user@gmail.com',
                first_name: 'Test',
                last_name: 'User',
                phone: '0123456789',
                role: 'user',
                username: 'testuser'
            }
        };

        // แสดงข้อมูลผู้ใช้
        function showSampleUsers() {
            const result = document.getElementById('usersData');
            result.style.display = 'block';
            result.innerHTML = JSON.stringify(sampleUsers, null, 2);
        }

        // เปิด Modal แก้ไข
        function openEditModal(userType) {
            const user = sampleUsers[userType];
            console.log('🔧 Opening edit modal for:', user);
            
            // เติมข้อมูลในฟอร์ม
            document.getElementById('username').value = user.username || '';
            document.getElementById('email').value = user.email || '';
            document.getElementById('first_name').value = user.first_name || '';
            document.getElementById('last_name').value = user.last_name || '';
            document.getElementById('phone').value = user.phone || '';
            document.getElementById('role').value = user.role || 'user';
            
            // แสดง Modal
            document.getElementById('editModal').style.display = 'block';
            
            console.log('✅ Modal opened with data:', {
                username: user.username,
                email: user.email,
                first_name: user.first_name,
                last_name: user.last_name,
                phone: user.phone,
                role: user.role
            });
        }

        // ปิด Modal
        function closeModal() {
            document.getElementById('editModal').style.display = 'none';
            console.log('❌ Modal closed');
        }

        // บันทึกข้อมูล
        function saveUser() {
            const formData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                first_name: document.getElementById('first_name').value,
                last_name: document.getElementById('last_name').value,
                phone: document.getElementById('phone').value,
                role: document.getElementById('role').value
            };
            
            console.log('💾 Saving user data:', formData);
            alert('✅ ข้อมูลถูกบันทึกแล้ว!\n\n' + JSON.stringify(formData, null, 2));
            closeModal();
        }

        // ปิด Modal เมื่อคลิกนอก Modal
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        console.log('🚀 User Modal Test Page Ready');
    </script>
</body>
</html>
