<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Profile Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-md">
        <div class="bg-white rounded-lg shadow p-6">
            <h1 class="text-2xl font-bold mb-6 text-center">Profile Access Test</h1>
            
            <div class="space-y-4">
                <button onclick="loginAndGo()" 
                        class="w-full bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition-colors">
                    🔐 Login & Go to Profile
                </button>
                
                <button onclick="goDirectly()" 
                        class="w-full bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 transition-colors">
                    📄 Go to Profile Directly
                </button>
                
                <button onclick="checkCookies()" 
                        class="w-full bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600 transition-colors">
                    🍪 Check Auth Cookies
                </button>
                
                <button onclick="clearAuth()" 
                        class="w-full bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition-colors">
                    🗑️ Clear Auth Data
                </button>
            </div>
            
            <div id="status" class="mt-4 p-3 bg-gray-50 rounded text-sm font-mono min-h-20"></div>
        </div>
    </div>

    <script>
        function log(message) {
            const status = document.getElementById('status');
            status.innerHTML += message + '\n';
            status.scrollTop = status.scrollHeight;
        }

        async function loginAndGo() {
            log('🔄 Starting login process...');
            
            try {
                // Step 1: Login via API
                const response = await fetch('http://localhost:3003/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'admin@royalgarden.com',
                        password: 'admin123'
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`Login failed: ${response.status}`);
                }
                
                const data = await response.json();
                log('✅ API login successful');
                
                // Step 2: Set cookies like the AuthContext does
                const expiresDate = new Date();
                expiresDate.setDate(expiresDate.getDate() + 7);
                
                document.cookie = `auth_token=${data.token}; expires=${expiresDate.toUTCString()}; path=/; SameSite=Strict`;
                document.cookie = `user_data=${encodeURIComponent(JSON.stringify(data.user))}; expires=${expiresDate.toUTCString()}; path=/; SameSite=Strict`;
                
                log('🍪 Cookies set');
                
                // Step 3: Wait and redirect
                setTimeout(() => {
                    log('🔄 Redirecting to profile...');
                    window.location.href = '/admin/profile';
                }, 1000);
                
            } catch (error) {
                log('❌ Error: ' + error.message);
            }
        }

        function goDirectly() {
            log('🔄 Going to profile directly...');
            window.location.href = '/admin/profile';
        }

        function checkCookies() {
            log('=== Cookie Check ===');
            const cookies = document.cookie.split(';').reduce((acc, cookie) => {
                const [key, value] = cookie.trim().split('=');
                acc[key] = value;
                return acc;
            }, {});
            
            log('auth_token: ' + (cookies.auth_token ? 'Present ✅' : 'Missing ❌'));
            log('user_data: ' + (cookies.user_data ? 'Present ✅' : 'Missing ❌'));
            
            if (cookies.user_data) {
                try {
                    const userData = JSON.parse(decodeURIComponent(cookies.user_data));
                    log('User: ' + userData.email + ' (' + userData.role + ')');
                } catch (e) {
                    log('Error parsing user data');
                }
            }
        }

        function clearAuth() {
            log('🗑️ Clearing auth data...');
            document.cookie = 'auth_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            document.cookie = 'user_data=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            localStorage.clear();
            sessionStorage.clear();
            log('✅ Auth data cleared');
        }

        // Check initial state
        window.onload = function() {
            checkCookies();
        }
    </script>
</body>
</html>
