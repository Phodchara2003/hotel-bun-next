<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Profile Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-6">Test Profile Page</h1>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Login First</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email</label>
                    <input type="email" id="email" value="admin@royalgarden.com" 
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" value="admin123"
                           class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <button onclick="login()" 
                        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Login
                </button>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Test Profile API</h2>
            <div class="space-y-4">
                <button onclick="testProfile()" 
                        class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                    Test Get Profile
                </button>
                <button onclick="goToProfile()" 
                        class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
                    Go to Profile Page
                </button>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">Results</h2>
            <pre id="results" class="bg-gray-100 p-4 rounded text-sm overflow-auto max-h-96"></pre>
        </div>
    </div>

    <script>
        let token = '';
        
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('http://localhost:3003/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    document.getElementById('results').textContent = 
                        'Login successful!\nToken: ' + token.substring(0, 50) + '...';
                } else {
                    document.getElementById('results').textContent = 
                        'Login failed: ' + JSON.stringify(data, null, 2);
                }
            } catch (error) {
                document.getElementById('results').textContent = 
                    'Login error: ' + error.message;
            }
        }
        
        async function testProfile() {
            if (!token) {
                token = localStorage.getItem('token');
            }
            
            if (!token) {
                document.getElementById('results').textContent = 
                    'Please login first!';
                return;
            }
            
            try {
                const response = await fetch('/api/profile', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                document.getElementById('results').textContent = 
                    'Profile API Response:\n' + JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('results').textContent = 
                    'Profile API error: ' + error.message;
            }
        }
        
        function goToProfile() {
            if (!token) {
                token = localStorage.getItem('token');
            }
            
            if (!token) {
                alert('Please login first!');
                return;
            }
            
            window.location.href = '/admin/profile';
        }
        
        // Check if token exists on page load
        window.onload = function() {
            const savedToken = localStorage.getItem('token');
            if (savedToken) {
                token = savedToken;
                document.getElementById('results').textContent = 
                    'Found saved token: ' + token.substring(0, 50) + '...';
            }
        }
    </script>
</body>
</html>
